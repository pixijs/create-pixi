name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.templates.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # The docs show template files, so moving a layer can break them
      - run: npm run typecheck --workspace docs
      - run: npm run build:docs
      - id: templates
        name: List templates
        run: |
          list=$(node --input-type=module -e "const { variants } = await import('./templates/manifest.ts'); console.log(JSON.stringify(variants.map((v) => v.id)))")
          echo "list=$list" >> "$GITHUB_OUTPUT"

  template:
    name: Template ${{ matrix.template }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.check.outputs.templates) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --workspaces=false
      - run: npm run build
      - run: npm run verify -- ${{ matrix.template }}
